<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nuki's Colorful Adventure</title>
  </head>
  <body>
    <main class="screen">
      <div class="game-view">
        <canvas></canvas>
        <button class="full-screen-switch" type="button" aria-label="Full screen" aria-pressed="false"></button>
        <button class="sound-switch" type="button" aria-label="Sound" aria-pressed="true"></button>
      </div>
      <p class="announcement" aria-live="polite"></p>
      <div class="control-panel">
        <div class="joystick" aria-hidden="true">
          <span class="arrow arrow-up"></span>
          <span class="arrow arrow-right"></span>
          <span class="arrow arrow-down"></span>
          <span class="arrow arrow-left"></span>
          <div class="knob"></div>
        </div>
        <div class="action-cross">
          <button class="button-a" type="button">A</button>
          <button class="button-b" type="button">B</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
